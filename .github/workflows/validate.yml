name: Validate

on:
  push:
    branches:
      - main
    # Tags run the full suite too, so a release is validated as the artifact
    # people actually install rather than as whatever main looked like.
    tags:
      - "v*"
  pull_request:

jobs:
  version:
    name: Manifest version matches tag
    runs-on: ubuntu-latest
    # v0.1.1 was tagged and released while manifest.json still said 0.1.0, so
    # every install of it reported the wrong version to HACS and to the device
    # registry. Nothing caught it: the manifest test only asserts the field is
    # a non-empty string, which a stale version satisfies perfectly.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Compare manifest.json against the tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r '.version' custom_components/surgex/manifest.json)"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error file=custom_components/surgex/manifest.json::Tag \
          ${GITHUB_REF_NAME} means version ${tag_version}, but manifest.json \
          declares ${manifest_version}. Bump the manifest, delete the tag and \
          the release, and tag again -- an install of this release would \
          report ${manifest_version} to HACS."
            exit 1
          fi
          echo "manifest.json declares ${manifest_version}, matching ${GITHUB_REF_NAME}."

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  pytest:
    name: Pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # Both results are wanted: knowing the floor broke is no reason to stop
      # reporting whether current Home Assistant is fine, and vice versa.
      fail-fast: false
      matrix:
        include:
          - name: current HA
            requirements: requirements-test.txt
            check_floor: false
          # Testing only the newest HA once hid a real break: HA shipped aiohttp
          # 3.13 until 2026.7, and code written against an aiohttp 3.14 API took
          # the integration down on every release from 2026.2 to 2026.6 while CI
          # stayed green. The floor is only supported if it is exercised.
          - name: minimum supported HA
            requirements: requirements-test-min.txt
            check_floor: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r ${{ matrix.requirements }}
      - name: Confirm the installed HA matches the floor declared in hacs.json
        if: matrix.check_floor
        run: |
          set -euo pipefail
          declared="$(jq -r '.homeassistant' hacs.json)"
          installed="$(python -c 'import homeassistant.const as c; print(c.__version__)')"
          if [ "$declared" != "$installed" ]; then
            echo "::error file=requirements-test-min.txt::hacs.json claims support \
          from HA ${declared}, but this job tests ${installed}. Point \
          requirements-test-min.txt at the pytest-homeassistant-custom-component \
          release pinning ${declared}, or correct hacs.json -- otherwise the \
          declared floor is untested."
            exit 1
          fi
          echo "Testing HA ${installed}, matching the floor declared in hacs.json."
      - name: Run tests
        run: pytest -v
