name: Validate

on:
  push:
    branches:
      - main
    # Tags run the full suite too, so a release is validated as the artifact
    # people actually install rather than as whatever main looked like.
    tags:
      - "v*"
  pull_request:

jobs:
  version:
    name: Manifest version matches tag
    runs-on: ubuntu-latest
    # v0.1.1 was tagged and released while manifest.json still said 0.1.0, so
    # every install of it reported the wrong version to HACS and to the device
    # registry. Nothing caught it: the manifest test only asserts the field is
    # a non-empty string, which a stale version satisfies perfectly.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Compare manifest.json against the tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r '.version' custom_components/surgex/manifest.json)"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error file=custom_components/surgex/manifest.json::Tag \
          ${GITHUB_REF_NAME} means version ${tag_version}, but manifest.json \
          declares ${manifest_version}. Bump the manifest, delete the tag and \
          the release, and tag again -- an install of this release would \
          report ${manifest_version} to HACS."
            exit 1
          fi
          echo "manifest.json declares ${manifest_version}, matching ${GITHUB_REF_NAME}."

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest -v
